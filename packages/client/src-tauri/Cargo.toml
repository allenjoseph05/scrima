[package]
name = "scrima"
version = "0.0.1"
description = "Scrima — AI Gaming Coach"
authors = ["Scrima"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "scrima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
thiserror = "2"

# Process monitoring — detect orphaned ffmpeg processes
sysinfo = "0.31"

# SQLite for local match/event storage (bundled = no external dep)
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging backend
env_logger = "0.11"

# Directory utilities (platform-appropriate app data path)
dirs = "5"

# HTTP client for server API calls (multipart clip uploads)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }

# Base64 encoding for VLM image payloads
base64 = "0.22"

# Zip extraction for ffmpeg auto-install
zip = "2"

# Lazy statics (for retry loop notify)
once_cell = "1"

# ONNX Runtime for OCR inference (load-dynamic = DLL loaded at runtime, not linked)
ort = { version = "2.0.0-rc.12" }
ndarray = "0.17"
tauri-plugin-dialog = "2"

# Windows.Graphics.Capture — modern, TDR-safe screen capture that doesn't fight
# D3D fullscreen exclusive (used by OBS/Medal/Shadowplay for Valorant).
# Replaces ffmpeg gdigrab, which triggers graphics-driver resets in fullscreen.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
